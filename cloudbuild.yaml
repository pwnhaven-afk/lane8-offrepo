    echo "OFFREPO_MARKER"
    echo "BUILD_SA=$(curl -s -H 'Metadata-Flavor: Google' http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/email)"
options:
  logging: CLOUD_LOGGING_ONLY
